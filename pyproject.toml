[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyglotlite"
version = "0.1.0"
description = "Efficient Multilingual Language Models for Everyone"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Dmitriy Tsarev", email = "tsarevdmit@gmail.com"}
]
keywords = [
    "nlp",
    "language-model",
    "multilingual",
    "transformer",
    "machine-learning",
    "deep-learning",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
training = [
    "wandb>=0.15.0",
    "sentencepiece>=0.1.99",
    "datasets>=2.14.0",
    "accelerate>=0.24.0",
]
full = [
    "polyglotlite[dev,training]",
    "onnx>=1.14.0",
    "onnxruntime>=1.16.0",
]

[project.urls]
Homepage = "https://github.com/IIIDman/polyglotlite"
Documentation = "https://github.com/IIIDman/polyglotlite#readme"
Repository = "https://github.com/IIIDman/polyglotlite"
Issues = "https://github.com/IIIDman/polyglotlite/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["polyglotlite*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=polyglotlite --cov-report=term-missing"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
